<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Jaïi &amp; Kayy — Anniversary Flipbook</title>
  <link rel="preload" as="image" href="assets/page-01.webp">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="stage">
    <div class="book" id="book" tabindex="0" role="group" aria-label="Anniversary flipbook. Click the right side or press the right arrow to advance; click the left side or press the left arrow to go back. Swipe on touchscreens.">
      <div class="page-under"><img id="underImage" src="assets/page-01.webp" alt="Page 1 of 10: Happy Anniversary"></div>
      <div class="page-flip" id="pageFlip" aria-hidden="true">
        <div class="flip-front"><img id="flipFrontImage" alt=""></div>
        <div class="flip-back"><img id="flipBackImage" alt=""></div>
      </div>
    </div>
  </main>
  <p class="flip-instruction">Press Left Or Right On The Keyboard To Flip Pages</p>
</body>
</html>
